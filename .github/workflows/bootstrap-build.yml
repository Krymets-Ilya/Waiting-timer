name: Bootstrap and Build Android

on:
  push:
    branches:
      - prototype-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Android source tree
        shell: bash
        run: |
          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            grep '^H4s' .github/workflows/android.yml | tr -d '\n' | base64 -d > /tmp/waiting-src.tgz
            tar -xzf /tmp/waiting-src.tgz
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add settings.gradle build.gradle .gitignore app
            git commit -m 'Implement Waiting/Wasting Time Android prototype v1 [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waiting-timer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
